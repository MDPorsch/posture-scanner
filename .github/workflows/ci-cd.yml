name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  # ── Runs on every push and every PR ──────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scanner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scanner_test
      DJANGO_SETTINGS_MODULE: scanner.settings.dev
      SECRET_KEY: ci-only-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint with ruff
        run: ruff check backend/
      - name: Run tests + coverage
        run: pytest
        working-directory: backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  # ── Deploys to STAGING when staging branch is updated ────────
  deploy-staging:
    name: Deploy → staging
    needs: [test, frontend-build]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render staging deploy
        run: curl -fsS "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

  # ── Deploys to PRODUCTION when lead merges into main ─────────
  deploy-prod:
    name: Deploy → production
    needs: [test, frontend-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for Sentry commit association
      - name: Trigger Render production deploy
        run: curl -fsS "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
      - name: Create Sentry release & associate commits
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:    ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}